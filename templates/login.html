<!DOCTYPE html>
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>login</title>
<link rel="stylesheet" href="../static/logim.css">
</head>
<body>

    <div class="login">
        <h1>Fazer Login</h1>

        <form action="/usuario/login" method="POST">
            <label>Login:</label>
            <input type="text" name="usuario" required>
            <br><br>

            <label>Senha:</label>
            <input type="password" name="senha" required>
            <br><br>

            <button type="submit">Entrar</button>
        </form>

        <br>
        <a href="/">Voltar ao Início</a>
    </div>
</body>
</html>
