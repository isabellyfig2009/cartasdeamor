<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enviar Carta</title>
<link rel="stylesheet" href="../static/css/enviar.css"></head>
<body>

    <div class="card-carta">
        <h1>Enviar Carta</h1>

        <form action="/logado/salvarcarta" method="POST">
            <input type="hidden" name="usuario" value="{{ usuario }}">

            <div class="form-group">
                <label for="destinatario">Enviar para:</label>
                <input type="text" id="destinatario" name="destinatario" placeholder="Nome do seu amor...">
            </div>

            <div class="form-group">
                <label for="texto">Carta:</label>
                <textarea id="texto" name="texto" rows="10" placeholder="Escreva o que está no seu coração..."></textarea>
            </div>

            <button type="submit">
                Enviar Carta ♥
            </button>
        </form>
    </div>

</body>
</html>
